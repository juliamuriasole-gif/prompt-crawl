name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run demo
      - run: test -s report/index.html && test -s report/graph.json
      - run: node bin/prompt-crawl.js fixtures/sample-prompt.md | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))"
